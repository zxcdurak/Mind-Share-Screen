<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Напоминания о конференциях</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="reminders.css">
</head>
<body>
  <main>
    <h1>Напоминания о конференциях</h1>

    <section id="perm" aria-live="polite"></section>

    <section id="chat"></section>

    <section>
      <h2>Расписание</h2>
      <p class="hint">Для каждой конференции задайте дни недели и время начала. Расписание сохраняется само. Уведомления приходят только при включённых напоминаниях.</p>
      <p id="saved" class="saved" role="status"></p>
      <div id="cards"></div>
      <p id="empty" class="hint" hidden>В избранном пока ничего нет. Добавьте конференцию через кнопку расширения на панели инструментов.</p>
    </section>
  </main>

  <script src="../shared/common.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="reminders.js"></script>
</body>
</html>
